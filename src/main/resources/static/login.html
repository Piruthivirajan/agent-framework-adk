<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Agent Framework</title>
<style>
  :root { --bg: #f6f7f9; --panel: #ffffff; --text: #1c2330; --muted: #5d6778; --line: #dfe3ea; --accent: #2457d6; --accent-text: #ffffff; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa4b5; --line: #2c3340; --accent: #6c93ff; --accent-text: #0b1020; --bad: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: min(360px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  input { font: inherit; width: 100%; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  button { font: inherit; width: 100%; margin-top: 12px; padding: 9px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { color: var(--bad); font-size: 13px; min-height: 20px; margin-top: 10px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="form">
  <h1>Agent Framework</h1>
  <p>Enter the demo password to continue.</p>
  <label for="password" style="font-size:13px;color:var(--muted)">Password</label>
  <input id="password" type="password" autocomplete="current-password" autofocus required>
  <button id="go" type="submit">Sign in</button>
  <div id="msg" role="alert"></div>
</form>
<script>
(function () {
  'use strict';
  var form = document.getElementById('form'), msg = document.getElementById('msg'), go = document.getElementById('go');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    msg.textContent = '';
    go.disabled = true;
    fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (d) {
        if (res.ok) { window.location.href = '/'; return; }
        msg.textContent = d.message || 'Sign in failed (' + res.status + ').';
        document.getElementById('password').select();
      });
    }).catch(function () {
      msg.textContent = 'The server could not be reached.';
    }).then(function () { go.disabled = false; });
  });
})();
</script>
</body>
</html>
