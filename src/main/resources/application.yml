server:
  # none | native | framework. "native" (behind the Caddy proxy) makes the client address the one in
  # X-Forwarded-For, so the login lockout counts the real client and not the proxy.
  forward-headers-strategy: ${AGENTFW_FORWARD_HEADERS:none}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax          # no cross-site form post can ride on the session
        secure: ${AGENTFW_COOKIE_SECURE:false}   # true when served over https (the deployment sets it)
      timeout: 8h

spring:
  application:
    name: agent-framework
  servlet:
    multipart:
      # keep equal to agentfw.files.max-bytes; the application also checks it and explains it in words
      max-file-size: 20000000B
      max-request-size: 21000000B
  config:
    # Loads GOOGLE_API_KEY (and other secrets) from the gitignored .env in the working directory.
    import: optional:file:.env[.properties]
  mongodb:
    # directConnection: the Atlas local container advertises its container hostname, which the
    # host cannot resolve, so the driver must not follow replica set discovery.
    uri: mongodb://localhost:27017/agentfw?directConnection=true

agentfw:
  tenant-id: demo
  embedding:
    provider: gemini            # "fake" is used by tests; the fake lives in src/test
    model: gemini-embedding-2
    dimensions: 768             # drives both the API call and the vector index numDimensions
    batch-size: 32
    max-retries: 5
    api-key: ${GOOGLE_API_KEY:}
  llm:
    provider: gemini                 # "fake" is used by tests; the fake lives in src/test
    model: gemini-3.8-flash          # coordinator and agents; the name is configuration, not code
    api-key: ${GOOGLE_API_KEY:}
    coordinator-thinking-budget: 128 # the coordinator only routes; measured against the default in docs/END_TO_END.md
    agent-thinking-budget: 0         # measured on all 48 questions: median 15.8 s -> 12.3 s, no loss of quality (docs/END_TO_END.md)
    max-llm-calls: 12                # per request: runaway-loop and cost guard
  rerank:
    provider: djl                                  # "fake" is used by tests; the fake lives in src/test
    model-dir: models/ms-marco-MiniLM-L-6-v2       # gitignored; downloaded and sha256-verified on first start
    model-file: model.onnx                         # fp32; or model_quint8_avx2.onnx (int8)
    max-length: 512
  files:
    max-bytes: 20000000          # largest upload
    max-chars: 1000000           # largest extracted text: about 110 s to summarize (measured, docs/PROGRESS.md Day 5 step 9).
                                 # The 1,003-page framework PDF has 2.5M characters and needs 3000000 (about 4 minutes)
    ttl-hours: 24                # uploads are deleted by a MongoDB TTL index after this
    max-files-per-session: 10
  summary:
    single-pass-max-chars: 30000 # up to this size: one model call
    segment-chars: 15000         # map step segment size
    reduce-max-chars: 30000      # most partial-summary text sent to one reduce call
    parallelism: 4               # concurrent model calls in the map step; 8 gave the same time (measured)
    max-retries: 2
    max-segments: 250            # covers max-chars up to the 3,000,000 ceiling at 15,000 characters a part
  chat:
    rewrite-follow-ups: false    # a separate rewrite call (+2.5 to 4.5 s per turn); the coordinator now restates follow-ups itself
    history-turns: 4
    max-sessions: 500
  mcp:
    # Hosts that may be used as MCP server addresses although they are on a private or local network
    # (the demo MCP server). Everything private, loopback or link-local is refused otherwise (SSRF guard).
    allowed-hosts: ${AGENTFW_MCP_ALLOWED_HOSTS:}
  sample-agent:
    # The sample third agent (ClockAgentPlugin). Off by default; set AGENTFW_SAMPLE_AGENT=true to enable it
    # for the "one new class" demo. Nothing else changes: the coordinator picks it up from the registry.
    enabled: ${AGENTFW_SAMPLE_AGENT:false}
  auth:
    # The demo login. Empty = the application is open (fine on a laptop, not on a reachable host).
    password: ${AGENTFW_DEMO_PASSWORD:}
    max-failures: 5              # wrong passwords per client address ...
    lock-seconds: 300            # ... within this window, then the login is refused for the rest of it
    session-hours: 8
  rag:
    max-searches: 2              # enforced in the search tool, not only in the prompt (docs/e2e/findings.md, section 7)
    stop-after-floor-miss: true  # a first search below the floor ends the turn: rewriting did not rescue any question
    # instruction-suffix: unset in production; the adversarial experiment sets it
  retrieval:
    fusion: RANK                 # RANK ($rankFusion) | SCORE ($scoreFusion) | JAVA_RRF
    num-candidates: 400          # MongoDB guidance: at least 20x the limit
    per-pipeline-limit: 20
    fused-limit: 20
    rerank-depth: 12             # fused candidates the cross-encoder scores; 12 kept the answer page in the final 5 for
                                 # all 32 in-corpus questions that 20 did (docs/CALIBRATION.md)
    final-top-n: 5
    vector-weight: 1.0
    text-weight: 1.0
    normalization: sigmoid       # $scoreFusion only
    rrf-k: 60
    # Retrieval floor, from docs/CALIBRATION.md: just below the lowest top-1 score of any in-corpus question
    # of the calibration set (-6.38, rounded down), so it removes only clear junk and no in-corpus question.
    # Unset would mean "not calibrated" and the gate would report NOT_CALIBRATED.
    min-rerank-score: -6.5
    # Informational only: the trace marks a top score at or above this as "high confidence". No behaviour change.
    # 3.3 is the balanced-accuracy optimum of the baseline calibration.
    high-confidence-score: 3.3
  ingestion:
    corpus-dir: corpus
    on-startup: ${AGENTFW_INGESTION_ON_STARTUP:false}   # true in the deployment: seeds the corpus at start (idempotent)
    chunk-target-tokens: 650
    chunk-overlap-percent: 15
    chunk-min-tail-tokens: 100
