# Tests never call the Gemini API: the real EmbeddingService bean is only created for provider=gemini,
# and FakeEmbeddingService (src/test) only for provider=fake. The key is blanked as a second guard.
agentfw.embedding.provider=fake
agentfw.embedding.api-key=
# Same rule for the reranker: tests use the fake and never need the model files.
agentfw.rerank.provider=fake
# Same rule for the language model: tests use the scripted fake and never reach Gemini.
agentfw.llm.provider=fake
agentfw.llm.api-key=
# The startup warm-up makes a real search and model call; tests never want that in the background.
agentfw.warmup.enabled=false
